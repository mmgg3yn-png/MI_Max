name: Build Mi_Max Launcher from OpenLauncher (ARM32 + ARM64)

on:
  workflow_dispatch:
  push:
    branches:
      - openlauncher-foundation

concurrency:
  group: mimax-openlauncher-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Mi_Max integration
        uses: actions/checkout@v4
        with:
          path: project

      - name: Checkout pinned OpenLauncher upstream
        uses: actions/checkout@v4
        with:
          repository: linsmod/openlauncher-2026
          ref: 683e11199c67024132287757a55665f56fc6fff6
          path: launcher-src

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Validate and apply Mi_Max integration
        working-directory: launcher-src
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile ../project/scripts/brand_openlauncher.py ../project/scripts/extend_mimax.py
          python3 ../project/scripts/brand_openlauncher.py
          python3 ../project/scripts/extend_mimax.py

      - name: Build Mi_Max launcher
        working-directory: launcher-src
        run: gradle :app:assembleFlavorDefaultRelease --no-daemon --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find launcher-src/app/build/outputs/apk -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          unzip -t "$APK"
          BADGING="$("$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$APK")"
          grep -q "package: name='com.mimax.launcher'" <<< "$BADGING"
          # This upstream launcher is Java-only. If native libraries are added later,
          # require both ARM ABIs rather than trusting Gradle abiFilters alone.
          NATIVE_ABIS="$(unzip -Z1 "$APK" | awk -F/ '$1=="lib" && NF>=3 {print $2}' | sort -u | tr '\n' ' ')"
          if [[ -n "$NATIVE_ABIS" ]]; then
            grep -qw 'armeabi-v7a' <<< "$NATIVE_ABIS"
            grep -qw 'arm64-v8a' <<< "$NATIVE_ABIS"
          fi
          mkdir -p dist
          cp "$APK" dist/Mi_Max_Launcher-OpenLauncher-ARM32-ARM64.apk
          sha256sum dist/Mi_Max_Launcher-OpenLauncher-ARM32-ARM64.apk
          ls -lh dist/Mi_Max_Launcher-OpenLauncher-ARM32-ARM64.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mi_Max_Launcher-OpenLauncher-ARM32-ARM64
          path: dist/Mi_Max_Launcher-OpenLauncher-ARM32-ARM64.apk
          if-no-files-found: error
          retention-days: 30
