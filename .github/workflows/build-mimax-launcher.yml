name: Build Mi_Max Launcher (Universal ARM32 + ARM64)

on:
  push:
    paths:
      - ".github/workflows/build-mimax-launcher.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Mi_Max build configuration
        uses: actions/checkout@v4
        with:
          path: project

      - name: Checkout upstream OpenLauncher source
        uses: actions/checkout@v4
        with:
          repository: linsmod/openlauncher-2026
          ref: master
          path: launcher-src

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Apply Mi_Max branding and universal ABI configuration
        working-directory: launcher-src
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle")
          s = p.read_text()
          replacements = [
              ('applicationId "com.benny.openlauncher"', 'applicationId "com.mimax.launcher"'),
              ('resValue \'string\', \'app_name\', "OpenLauncher"', 'resValue \'string\', \'app_name\', "Mi_Max Launcher"'),
              ('resValue "string", "manifest_package_id", "com.benny.openlauncher"', 'resValue "string", "manifest_package_id", "com.mimax.launcher"'),
              ('versionCode 37', 'versionCode 38'),
              ('versionName "0.6.1"', 'versionName "1.0.0-mimax.1"'),
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f"Expected Gradle marker not found: {old}")
              s = s.replace(old, new, 1)
          marker = '        multiDexEnabled false'
          if marker not in s:
              raise SystemExit("Could not locate defaultConfig ABI insertion point")
          s = s.replace(marker, marker + '\n\n        // One APK supports both ARM32 and ARM64; no ABI split is generated.\n        ndk { abiFilters "armeabi-v7a", "arm64-v8a" }', 1)
          p.write_text(s)

          p = Path("settings.gradle")
          s = p.read_text().replace('rootProject.name = "OpenLauncher"', 'rootProject.name = "Mi_Max Launcher"')
          p.write_text(s)

          p = Path("app/src/main/res/values/strings.xml")
          s = p.read_text()
          marker = '</resources>'
          extra = '''
              <string name="mimax_developer_title">Mi_Max Developer</string>
              <string name="mimax_developer_summary">محمد السعيد علي\nPorting, adaptation and maintenance for ARM32 and ARM64 devices outside Xiaomi.\nmmgg3yn@gmail.com | Telegram: @Mi_Max12</string>
          '''
          if 'name="mimax_developer_title"' not in s:
              if marker not in s:
                  raise SystemExit("Could not find strings.xml closing resources tag")
              s = s.replace(marker, extra + '\n' + marker, 1)
          p.write_text(s)

          p = Path("app/src/main/res/xml/preferences_about.xml")
          s = p.read_text()
          marker = '    </PreferenceCategory>\n\n    <PreferenceCategory\n        android:key="@string/pref_key__more_info__project_community"'
          addition = '''        <Preference
            android:icon="@drawable/ic_info_black_24dp"
            android:title="@string/mimax_developer_title"
            android:summary="@string/mimax_developer_summary" />

'''
          if 'mimax_developer_title' not in s:
              if marker not in s:
                  raise SystemExit("Could not find project team category insertion point")
              s = s.replace(marker, addition + marker, 1)
          p.write_text(s)
          PY

      - name: Build one universal APK
        working-directory: launcher-src
        run: gradle :app:assembleFlavorDefaultRelease --no-daemon

      - name: Verify APK output
        run: |
          APK="$(find launcher-src/app/build/outputs/apk/flavorDefault/release -maxdepth 1 -name '*.apk' | head -n 1)"
          test -n "$APK"
          mkdir -p dist
          cp "$APK" dist/Mi_Max_Launcher-universal-ARM32-ARM64.apk
          ls -lh dist/Mi_Max_Launcher-universal-ARM32-ARM64.apk
          unzip -l dist/Mi_Max_Launcher-universal-ARM32-ARM64.apk | grep -E 'classes.dex|AndroidManifest.xml' | head

      - name: Upload universal APK
        uses: actions/upload-artifact@v4
        with:
          name: Mi_Max_Launcher-universal-ARM32-ARM64
          path: dist/Mi_Max_Launcher-universal-ARM32-ARM64.apk
          if-no-files-found: error
          retention-days: 30
